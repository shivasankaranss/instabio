<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maom Instagram Page</title>
<meta name="theme-color" content="#0a0e2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+Devanagari:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#080c26; --indigo:#171c4f; --teal:#1d6a75; --saffron:#f4b860; --lilac:#b7a6ff;
  --ink:#f4f3ff; --ink-soft:rgba(244,243,255,.72);
  --glass:rgba(255,255,255,.09); --glass-edge:rgba(255,255,255,.28);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--night); overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
/* Background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(60vmax 60vmax at 15% 10%, #2a2a7a 0%, transparent 60%),
    radial-gradient(55vmax 55vmax at 90% 85%, var(--teal) 0%, transparent 62%),
    linear-gradient(160deg,#0a0e2a,#12163f 55%,#0b1a33);}
.figure{position:absolute;left:50%;top:52%;width:min(105vw,92vh,760px);aspect-ratio:1;
  transform:translate(-50%,-50%);opacity:.9}
.figure svg{width:100%;height:100%;display:block}
.breathe{transform-origin:50% 50%;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035)}}
/* OM particles */
.oms{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.om{position:absolute;left:0;top:0;font-family:"Noto Sans Devanagari","Nirmala UI",serif;
  color:#fff;opacity:0;will-change:transform;
  animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(-8deg);opacity:0}
  10%,85%{opacity:var(--o)}
  50%{transform:translate3d(var(--sway),50vh,0) rotate(8deg)}
  100%{transform:translate3d(0,112vh,0) rotate(-8deg);opacity:0}}
@keyframes rise{0%{transform:translate3d(0,112vh,0) rotate(8deg);opacity:0}
  10%,85%{opacity:var(--o)}
  50%{transform:translate3d(var(--sway),50vh,0) rotate(-8deg)}
  100%{transform:translate3d(0,-12vh,0) rotate(8deg);opacity:0}}
/* Page */
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:40px 20px 56px;
  display:flex;flex-direction:column;align-items:center;gap:22px}
.glass{
  position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 0 22px rgba(255,255,255,.05),0 18px 44px rgba(3,5,25,.45);
  overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(183,166,255,.14));
  mix-blend-mode:soft-light}
.logo-wrap{border-radius:30px;padding:14px 22px;display:grid;place-items:center}
.logo-wrap img{height:64px;width:auto;max-width:70vw;display:block}
header{text-align:center}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2rem,8vw,2.9rem);
  line-height:1.1;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(10,14,42,.6)}
.section{display:inline-block;margin-top:14px;padding:7px 20px;border-radius:999px;
  font-weight:600;font-size:1rem;letter-spacing:.06em}
.list-card{width:100%;border-radius:32px;padding:24px 18px 14px}
h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:1.35rem;padding:0 8px 12px}
ul{list-style:none;padding:0}
li{padding:15px 10px;font-size:1.05rem;line-height:1.4;color:var(--ink);
  border-top:1px solid rgba(255,255,255,.14)}
li:first-child{border-top:0}
.status{padding:16px 10px;color:var(--ink-soft);font-size:.98rem}
@media (prefers-reduced-motion:reduce){.breathe{animation:none}.om{display:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(30,34,90,.75)}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="figure">
    <svg viewBox="0 0 600 600" fill="none">
      <defs>
        <radialGradient id="aura" cx="50%" cy="38%" r="55%">
          <stop offset="0" stop-color="#f4b860" stop-opacity=".42"/>
          <stop offset=".55" stop-color="#b7a6ff" stop-opacity=".12"/>
          <stop offset="1" stop-color="#b7a6ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/>
          <stop offset="1" stop-color="#b7a6ff" stop-opacity=".16"/>
        </linearGradient>
      </defs>
      <g class="breathe">
        <circle cx="300" cy="260" r="250" fill="url(#aura)"/>
        <g stroke="#fff" stroke-opacity=".12">
          <circle cx="300" cy="260" r="120"/><circle cx="300" cy="260" r="175"/><circle cx="300" cy="260" r="230"/>
        </g>
        <!-- lotus petals -->
        <g fill="#b7a6ff" fill-opacity=".10" stroke="#fff" stroke-opacity=".22">
          <path d="M300 520C250 505 190 480 150 440c50-8 100 10 150 80z"/>
          <path d="M300 520C350 505 410 480 450 440c-50-8-100 10-150 80z"/>
          <path d="M300 520C262 480 232 430 232 385c40 22 62 70 68 135z"/>
          <path d="M300 520C338 480 368 430 368 385c-40 22-62 70-68 135z"/>
          <path d="M300 520C280 470 280 420 300 372c20 48 20 98 0 148z"/>
        </g>
        <!-- crossed legs -->
        <path d="M120 450c30-48 110-62 180-62s150 14 180 62c-60 22-120 30-180 30s-120-8-180-30z"
              fill="url(#body)" stroke="#ffd9a0" stroke-opacity=".4"/>
        <!-- torso -->
        <path d="M300 205c-52 0-84 36-92 88-6 44 4 70 8 98 28 14 56 18 84 18s56-4 84-18c4-28 14-54 8-98-8-52-40-88-92-88z"
              fill="url(#body)" stroke="#ffd9a0" stroke-opacity=".4"/>
        <!-- head -->
        <circle cx="300" cy="160" r="42" fill="url(#body)" stroke="#ffd9a0" stroke-opacity=".5"/>
        <!-- hands resting -->
        <ellipse cx="300" cy="398" rx="46" ry="14" fill="#ffd9a0" fill-opacity=".28" stroke="#ffd9a0" stroke-opacity=".4"/>
        <!-- crown glow -->
        <circle cx="300" cy="96" r="6" fill="#f4b860" fill-opacity=".8"/>
      </g>
    </svg>
  </div>
</div>

<div class="oms" id="oms" aria-hidden="true"></div>

<main>
  <div class="glass logo-wrap">
    <img src="assets/amritalogo.png" alt="Amrita Vishwa Vidyapeetham logo">
  </div>

  <header>
    <h1>Maom Instagram Page</h1>
    <div class="glass section">CSE-H</div>
  </header>

  <section class="glass list-card" aria-labelledby="act">
    <h2 id="act">Activities</h2>
    <ul id="list"><li class="status">Loading activities…</li></ul>
  </section>
</main>

<script>
/* Activities from activities.json (edit that file on GitHub; oldest first) */
(async function(){
  const list=document.getElementById('list');
  try{
    const res=await fetch('activities.json',{cache:'no-cache'});
    if(!res.ok) throw new Error(res.status);
    const data=await res.json();
    const items=(data.activities||[]).map((a,i)=>({...a,_i:i}));
    items.sort((a,b)=>{
      const da=Date.parse(a.date),db=Date.parse(b.date);
      if(isNaN(da)||isNaN(db)) return a._i-b._i;
      return da-db||a._i-b._i;
    });
    list.innerHTML='';
    if(!items.length){list.innerHTML='<li class="status">No activities yet.</li>';return;}
    items.forEach(a=>{const li=document.createElement('li');li.textContent=a.title;list.appendChild(li);});
  }catch(e){
    list.innerHTML='<li class="status">Activities could not be loaded. Check that activities.json is in the same folder.</li>';
  }
})();

/* OM particles: some fall, some rise, kept few and faint */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.getElementById('oms'), n=innerWidth<600?10:16;
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); s.className='om'; s.textContent='ॐ';
    const dur=26+Math.random()*26;
    s.style.left=(Math.random()*96)+'vw';
    s.style.fontSize=(15+Math.random()*16)+'px';
    s.style.setProperty('--o',(0.10+Math.random()*0.14).toFixed(2));
    s.style.setProperty('--sway',((Math.random()*2-1)*40).toFixed(0)+'px');
    s.style.animationName=i%2?'rise':'fall';
    s.style.animationDuration=dur+'s';
    s.style.animationDelay=(-Math.random()*dur)+'s';
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
